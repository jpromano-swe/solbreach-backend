name: Deploy Backend

on:
  push:
    branches:
      - main
      - staging
      - develop
      - "**"
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract branch name
        id: branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "sanitized=${BRANCH_NAME//[^a-zA-Z0-9-]/-}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_LAMBDA_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Serverless Framework
        run: |
          npm install -g serverless@3
          serverless --version

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      - name: Deploy to AWS Lambda
        id: deploy
        run: |
          STAGE=${{ steps.branch.outputs.sanitized }}
          echo "Deploying stage: $STAGE"

          serverless deploy \
            --stage $STAGE \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }} \
            --verbose

      - name: Get API Gateway URL
        id: api-url
        run: |
          STAGE=${{ steps.branch.outputs.sanitized }}
          API_URL=$(serverless info --stage $STAGE --verbose 2>/dev/null | grep -i "HttpApi" | awk '{print $2}')
          if [ -z "$API_URL" ]; then
            API_URL="https://$(serverless info --stage $STAGE 2>/dev/null | grep 'ServiceEndpoint' | awk '{print $2}')"
          fi
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "Stage endpoint: $API_URL"

      - name: Comment PR with deployment info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Backend Deployed\n\n**Branch:** ${{ steps.branch.outputs.branch }}\n**Stage:** ${{ steps.branch.outputs.sanitized }}\n**API URL:** ${{ steps.api-url.outputs.api_url }}\n\nUpdate your frontend env var:\n\`\`\`\nexport NEXT_PUBLIC_API_URL=${{ steps.api-url.outputs.api_url }}\n\`\`\``
            })

      - name: Summary
        run: |
          echo "## Deployment Summary"
          echo "- Branch: ${{ steps.branch.outputs.branch }}"
          echo "- Stage: ${{ steps.branch.outputs.sanitized }}"
          echo "- API URL: ${{ steps.api-url.outputs.api_url }}"
