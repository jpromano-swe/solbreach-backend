[tool.poetry]
name = "solbreach-backend"
version = "0.1.0"
description = "SolBreach modular monolith backend"
authors = ["SolBreach"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.136.1"
uvicorn = { extras = ["standard"], version = "^0.30.6" }
mangum = "^0.19.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
aiosqlite = "^0.20.0"
alembic = "^1.13.3"
pydantic = { extras = ["email"], version = "^2.9.2" }
pydantic-settings = "^2.6.1"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = ">=4.0.1,<4.1"
pyjwt = "^2.9.0"
python-multipart = "^0.0.12"
PyNaCl = "^1.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"
ruff = "^0.7.1"
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app/modules"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
